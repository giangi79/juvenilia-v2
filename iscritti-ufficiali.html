<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iscritti alla gara | Juvenilia</title><link rel="stylesheet" href="css/styles.css"><style>
body{margin:0;background:#14283d;color:#eef7ff;font-family:system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:20px}.head{background:#204d75;border-radius:18px;padding:22px}.head img{max-width:300px;width:80%;background:white;border-radius:8px}.head h1{margin:16px 0 4px;color:white}.nav{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.nav a,.nav button{padding:10px 15px;border-radius:9px;border:1px solid #9ac7e1;background:#28648d;color:white;text-decoration:none;font:inherit;font-weight:700;cursor:pointer}.nav .active{background:#ffd166;color:#173b5a}.search{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;border:1px solid #96bacf;font:inherit}.status{padding:14px}.group{margin:14px 0;border:1px solid #55758a;border-radius:13px;overflow:hidden;background:#213a50}.group h2{margin:0;padding:12px 15px;background:#17527e;color:white;font-size:1.05rem}.row{padding:11px 15px;border-top:1px solid #486175}.row strong{display:block;color:white}.row span{display:block;color:#c8deeb;font-size:.88rem;margin-top:3px}.source{color:#b7dbed}.count{color:#cee7f6}.hidden{display:none}
 .filters{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}.filters label{display:grid;gap:5px;flex:1 1 190px;font-weight:700}.filters select{width:100%;padding:10px;border-radius:9px;font:inherit;color:#173b5a;background:#fff;border:1px solid #96bacf}.pull-refresh-hint{position:fixed;z-index:1000;top:12px;left:50%;padding:9px 14px;border-radius:999px;background:#123c62;color:#fff;box-shadow:0 7px 18px rgba(0,0,0,.22);font-size:.86rem;font-weight:800;pointer-events:none;opacity:0;transform:translate(-50%,-18px);transition:opacity .16s,transform .16s;white-space:nowrap}.pull-refresh-hint.visible{opacity:1;transform:translate(-50%,0)}.reset-filters{align-self:end;padding:10px 16px;border:1px solid #9ac7e1;border-radius:9px;background:#28648d;color:white;font:inherit;font-weight:700;cursor:pointer}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
.filters{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:8px!important;align-items:end;margin-top:9px!important}
.filters label{min-width:0;gap:3px!important;font-size:.78rem}
.filters select{min-height:40px;padding:7px 8px!important;font-size:.88rem!important}
.reset-filters{min-height:40px;padding:7px 11px!important;font-size:.85rem!important}
@media(max-width:600px){.filters{grid-template-columns:repeat(2,minmax(0,1fr)) auto}.filters label:first-child{grid-column:1/-1}.reset-filters{white-space:nowrap}}
</style><style>
.sticky-controls{position:sticky;top:0;z-index:50;background:#1a344c;padding:8px 10px 10px;border-radius:0 0 12px 12px;box-shadow:0 5px 18px rgba(0,0,0,.25)}
.sticky-controls .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border-radius:9px;background:#204d75}
.sticky-controls .head img{width:105px;max-width:25%;border-radius:4px}
.sticky-controls .head h1{margin:0;font-size:1.05rem;line-height:1.2}
.sticky-controls .head p{margin:0;flex:1 1 220px;font-size:.8rem;line-height:1.25}
.sticky-controls .nav{margin:7px 0;gap:6px}
.sticky-controls .nav a,.sticky-controls .nav button{min-height:36px;box-sizing:border-box;padding:6px 10px;font-size:.8rem;line-height:1.15}
.sticky-controls .search{min-height:38px;padding:7px 10px;font-size:.9rem}
.sticky-controls .filters{margin-top:6px!important;gap:6px!important}
.sticky-controls .filters label{font-size:.72rem;gap:2px!important}
.sticky-controls .filters select,.sticky-controls .reset-filters{min-height:36px;padding:5px 7px!important;font-size:.8rem!important}
@media(max-width:600px){
.wrap{padding:0 10px 15px}
.sticky-controls{margin:0 -10px;padding:6px 8px 8px}
.sticky-controls .head{gap:5px 8px;padding:5px 7px}
.sticky-controls .head img{width:78px}
.sticky-controls .head h1{font-size:.9rem}
.sticky-controls .head p{flex:1 1 100%;font-size:.72rem}
.sticky-controls .nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:5px 0}
.sticky-controls .nav a,.sticky-controls .nav button{min-width:0;min-height:34px;padding:5px 3px;font-size:.68rem;text-align:center;display:flex;align-items:center;justify-content:center}
.sticky-controls .filters{grid-template-columns:repeat(3,minmax(0,1fr)) auto}

.sticky-controls .search{font-size:16px}
.sticky-controls .reset-filters{font-size:.7rem!important;white-space:normal}
}
</style><style>
@media(max-width:600px){
.sticky-controls{position:fixed!important;top:0;left:0;right:0;z-index:50;margin:0!important;width:100%;box-sizing:border-box;padding-top:calc(6px + env(safe-area-inset-top, 0px))}
#stickySpacer{display:block}
}
@media(min-width:601px){#stickySpacer{display:none}}
</style><style>.filters{grid-template-columns:repeat(4,minmax(0,1fr)) auto!important}@media(max-width:600px){.sticky-controls .filters{grid-template-columns:repeat(3,minmax(0,1fr))!important}.sticky-controls .filters label:nth-child(4){grid-column:span 2}.sticky-controls .reset-filters{grid-column:3}}</style></head><body><main class="wrap"><div id="stickySpacer" aria-hidden="true"></div><div class="sticky-controls"><header class="head"><img src="assets/juvenilia-logo-orizzontale.png" alt="Polisportiva Juvenilia"><h1>Iscritti alla gara</h1><p id="race"></p></header><nav class="nav"><a href="index.html">← Torna alle gare</a><button id="cat">Per categoria</button><button id="club">Per società</button><a id="source" class="source" target="_blank" rel="noopener noreferrer">Pagina ufficiale ↗</a></nav><input id="search" class="search" type="search" placeholder="Cerca atleta, società o categoria…" aria-label="Cerca iscritti"><div class="filters"><label>Categoria<select id="categoryFilter"><option value="">Tutte le categorie</option></select></label><label>Sesso<select id="genderFilter"><option value="">Tutti</option><option value="F">Femmine</option><option value="M">Maschi</option></select></label><label>Gara<select id="raceFilter"><option value="">Tutte le gare</option></select></label><label>Società<select id="clubFilter"><option value="">Tutte le società</option></select></label><button id="resetFilters" type="button" class="reset-filters">Reset filtri</button></div></div><p id="status" class="status" role="status"></p><div id="results"></div></main><script>
(function(){
 const controls=document.querySelector('.sticky-controls'),spacer=document.getElementById('stickySpacer');
 function resizeControls(){spacer.style.height=matchMedia('(max-width:600px)').matches?Math.ceil(controls.getBoundingClientRect().height)+'px':'0px'}
 if(window.ResizeObserver)new ResizeObserver(resizeControls).observe(controls);
 window.addEventListener('resize',resizeControls);window.addEventListener('load',resizeControls);resizeControls();
})();
</script><script type="module" src="js/official-entrants-view.js?v=6"></script></body></html>
