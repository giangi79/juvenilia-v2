<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iscritti alla gara | Juvenilia</title><link rel="stylesheet" href="css/styles.css"><style>
body{margin:0;background:#14283d;color:#eef7ff;font-family:system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:20px}.head{background:#204d75;border-radius:18px;padding:22px}.head img{max-width:300px;width:80%;background:white;border-radius:8px}.head h1{margin:16px 0 4px;color:white}.nav{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.nav a,.nav button{padding:10px 15px;border-radius:9px;border:1px solid #9ac7e1;background:#28648d;color:white;text-decoration:none;font:inherit;font-weight:700;cursor:pointer}.nav .active{background:#ffd166;color:#173b5a}.search{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;border:1px solid #96bacf;font:inherit}.status{padding:14px}.group{margin:14px 0;border:1px solid #55758a;border-radius:13px;overflow:hidden;background:#213a50}.group h2{margin:0;padding:12px 15px;background:#17527e;color:white;font-size:1.05rem}.row{padding:11px 15px;border-top:1px solid #486175}.row strong{display:block;color:white}.row span{display:block;color:#c8deeb;font-size:.88rem;margin-top:3px}.source{color:#b7dbed}.count{color:#cee7f6}.hidden{display:none}
 .filters{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}.filters label{display:grid;gap:5px;flex:1 1 190px;font-weight:700}.filters select{width:100%;padding:10px;border-radius:9px;font:inherit;color:#173b5a;background:#fff;border:1px solid #96bacf}.pull-refresh-hint{position:fixed;z-index:1000;top:12px;left:50%;padding:9px 14px;border-radius:999px;background:#123c62;color:#fff;box-shadow:0 7px 18px rgba(0,0,0,.22);font-size:.86rem;font-weight:800;pointer-events:none;opacity:0;transform:translate(-50%,-18px);transition:opacity .16s,transform .16s;white-space:nowrap}.pull-refresh-hint.visible{opacity:1;transform:translate(-50%,0)}.reset-filters{align-self:end;padding:10px 16px;border:1px solid #9ac7e1;border-radius:9px;background:#28648d;color:white;font:inherit;font-weight:700;cursor:pointer}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>

.filters label{min-width:0;gap:3px!important;font-size:.78rem}
