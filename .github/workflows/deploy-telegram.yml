name: Aggiorna Telegram su Supabase

on:
  push:
    branches: [main]
    paths:
      - supabase/functions/telegram-dispatch/**
      - supabase/config.toml
      - .github/workflows/deploy-telegram.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-telegram
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Controlla il token Supabase
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo 'Aggiungi SUPABASE_ACCESS_TOKEN nei Secrets di GitHub (Settings > Secrets and variables > Actions).'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Pubblica telegram-dispatch
        run: supabase functions deploy telegram-dispatch --project-ref jnfnfszekfstuoiemkgf
