<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juvenilia · Test calendario FISR</title><style>body{margin:0;font:16px system-ui;background:#102c44;color:#f4f8ff}main{max-width:850px;margin:auto;padding:24px}button{background:#3d83ae;color:white;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:16px}input{padding:12px;border-radius:10px;border:1px solid #9fb3c3;width:100%;box-sizing:border-box;font-size:16px}.item{background:#1b405e;border:1px solid #48708e;border-radius:12px;padding:15px;margin:10px 0}.muted{color:#bdd3e3;font-size:14px}a{color:#9bd7ff}h1{font-size:26px}</style></head><body><main><h1>Calendario FISR · Prova iPhone</h1><p>Ricerca automatica di trofei e ID. Nessuna gara viene creata.</p><button id="load">Carica calendario FISR</button><p id="status" aria-live="polite"></p><div id="results" hidden><input id="search" type="search" placeholder="Cerca gara, città o ID"><p id="count"></p><div id="items"></div></div></main><script>
const endpoint='https://jnfnfszekfstuoiemkgf.supabase.co/functions/v1/fisr-calendar-preview';
const status=document.getElementById('status'),results=document.getElementById('results'),items=document.getElementById('items'),search=document.getElementById('search'),count=document.getElementById('count');let events=[];
function render(){items.replaceChildren();const q=search.value.trim().toLocaleLowerCase('it');const filtered=events.filter(e=>[e.nome,e.luogo,e.id_fisr,e.data].some(v=>String(v||'').toLocaleLowerCase('it').includes(q)));count.textContent=filtered.length+' trofei';for(const e of filtered){const card=document.createElement('div');card.className='item';const title=document.createElement('strong');title.textContent=e.nome;const info=document.createElement('p');info.className='muted';info.textContent=[e.data,e.luogo,'ID FISR '+e.id_fisr].filter(Boolean).join(' · ');const link=document.createElement('a');link.href=e.url;link.target='_blank';link.rel='noopener';link.textContent='Apri scheda FISR';const probe=document.createElement('button');probe.textContent='Leggi prove FISR';probe.style.cssText='display:block;margin:12px 0 0;font-size:14px;padding:10px';const output=document.createElement('div');probe.onclick=async()=>{probe.disabled=true;output.textContent='Verifica accesso alle prove…';try{const response=await fetch('https://jnfnfszekfstuoiemkgf.supabase.co/functions/v1/fisr-races-preview?id='+encodeURIComponent(e.id_fisr),{cache:'no-store'});const data=await response.json();output.replaceChildren();if(data.error||!data.accessible){output.textContent=data.error||data.reason||'Prove non disponibili senza accesso FISR';return}const summary=document.createElement('p');summary.textContent=data.count+' gare FISR riconosciute';output.append(summary);for(const race of data.gare||[]){const line=document.createElement('div');line.className='muted';line.textContent=[race.categoria,race.sesso,race.descrizione,'ID '+race.id_gara].join(' · ');output.append(line)}if(data.warning){const warning=document.createElement('p');warning.textContent=data.warning;output.append(warning)}}catch(err){output.textContent='Errore verifica: '+err.message}finally{probe.disabled=false}};card.append(title,info,link,probe,output);items.append(card)}}
search.oninput=render;
document.getElementById('load').onclick=async()=>{status.textContent='Lettura calendario FISR in corso…';results.hidden=true;try{const r=await fetch(endpoint,{cache:'no-store'});const data=await r.json();if(!r.ok||data.error)throw Error(data.error||'HTTP '+r.status);events=data.events||[];status.textContent=events.length?'Calendario letto correttamente.':'La pagina è stata raggiunta ma non sono stati riconosciuti ID: serve adattare la lettura FISR.';results.hidden=false;render()}catch(e){status.textContent='Impossibile leggere il calendario: '+e.message}};
</script></body></html>
